<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>geomotif explore</title>
  <link rel="stylesheet" href="app.css">
  <script>
    // Paint the right theme on first paint, before app.js loads: a stored
    // manual choice wins, otherwise the OS preference decides. Without this
    // the page would flash the light theme before app.js runs on a dark OS.
    (function () {
      var stored = localStorage.getItem("geomotif.theme");
      var dark = stored ? stored === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <header>
    <!-- The wordmark is a label, not a nav target; the return affordance is the
         primary "docs" pill at the far right (see .nav-pill). -->
    <span class="wordmark">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3v18"/>
        <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
      </svg>
      <b>geomotif</b><span class="dim">/ explore</span>
    </span>
    <!-- Mode tabs: a segmented Design / Animate control that replaces the
         stage-toolbar Play button as the single entry point to animation mode.
         Clicking Animate calls E.enterAnim(); clicking Design calls E.exitAnim().
         explore-mode.js owns the tab wiring and keeps aria-selected in sync with
         E.animOn so a share URL that boots into animation lights the right tab.
         Arrow keys move focus between tabs; Enter / Space (the <button> default)
         activates. The tabpanel roles land with the animator panel. -->
    <div class="mode-tabs" role="tablist" aria-label="mode">
      <button class="mode-tab" role="tab" id="mode-design" type="button" aria-selected="true" tabindex="0">Design</button>
      <button class="mode-tab" role="tab" id="mode-animate" type="button" aria-selected="false" tabindex="-1">Animate</button>
    </div>
    <button class="nav-link" id="theme" type="button" title="toggle light / dark" aria-pressed="false">
      <svg class="ico sun" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v2M8 12.5v2M1.5 8h2M12.5 8h2M3.4 3.4l1.4 1.4M11.2 11.2l1.4 1.4M12.6 3.4l-1.4 1.4M4.8 11.2l-1.4 1.4"/></svg>
      <svg class="ico moon" width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M13 9.5A5.5 5.5 0 1 1 6.5 3a4.5 4.5 0 0 0 6.5 6.5z"/></svg>
    </button>
    <span class="status" id="status">loading catalog…</span>
    <span class="progress" id="progress" aria-hidden="true"><i></i></span>
    <a class="nav-pill" href="/" title="back to docs" aria-label="Back to geomotif docs">docs</a>
  </header>

  <main class="layout">
    <aside class="rail">
      <div class="label">Motifs</div>
      <input class="search" type="search" placeholder="search motifs…" autocomplete="off" aria-label="search motifs">
      <nav class="families" id="families" aria-label="motif families"></nav>
      <ul class="motifs" id="motifs"></ul>
    </aside>

    <section class="stage-area">
      <div class="stage-wrap">
        <div class="stage" id="stage">
          <!-- Coordinate grid overlay: an SVG layer behind the motif that
               renders a Desmos-style plane -- major/minor gridlines, axes
               through the origin with arrowheads, and tick labels. It mirrors
               E.viewBox on every zoom/pan tick (repainted by explore-grid.js)
               and is hidden by .no-grid / .no-axes / .no-labels on .stage.
               It keeps the motif SVG's default preserveAspectRatio (xMidYMid
               meet) so the two layers are always mapped identically -- with
               preserveAspectRatio="none" the overlay could stretch differently
               from the picture on a non-square viewBox and drift. -->
          <svg class="grid-overlay" id="grid-overlay" viewBox="0 0 520 520" aria-hidden="true">
            <g class="grid-minor"></g>
            <g class="grid-major"></g>
            <g class="grid-axes"></g>
            <g class="grid-labels"></g>
          </svg>
          <!-- Stage toolbar: a floating row of icon glyphs
               top-right of the stage -- the zoom cluster (out / fit / in) then a
               gear-triggered popover holding the grid / axes / labels view
               toggles. On wide viewports the toggles show inline (the gear is
               hidden); under 50rem they collapse into the gear's popover so the
               row stays compact. The icons replace the wordy text labels the
               toolbar shipped with; titles + aria-labels keep them
               discoverable. explore-view.js wires the gear's open/close. -->
          <div class="stage-toolbar" id="toolbar" role="toolbar" aria-label="view">
            <button class="tb" id="zoom-out" type="button" title="zoom out" aria-label="zoom out">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/><path d="M4.6 7h4.8"/></svg>
            </button>
            <button class="tb" id="fit" type="button" title="fit to view" aria-label="fit to view">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6V4.5A1.5 1.5 0 0 1 4.5 3H6M10 3h1.5A1.5 1.5 0 0 1 13 4.5V6M13 10v1.5a1.5 1.5 0 0 1-1.5 1.5H10M6 13H4.5A1.5 1.5 0 0 1 3 11.5V10"/></svg>
            </button>
            <button class="tb" id="zoom-in" type="button" title="zoom in" aria-label="zoom in">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5 14 14"/><path d="M7 4.6v4.8M4.6 7h4.8"/></svg>
            </button>
            <span class="tb-sep" aria-hidden="true"></span>
            <div class="tg-popover" id="tg-popover">
              <div class="tg-popover-body">
                <button class="tb toggle" id="tg-grid" type="button" title="toggle coordinate grid" aria-label="coordinate grid" aria-pressed="true">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="10" height="10" rx="1"/><path d="M8 3v10M3 8h10"/></svg>
                </button>
                <button class="tb toggle" id="tg-axes" type="button" title="toggle axes through the origin" aria-label="axes through origin" aria-pressed="true">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 14V2M8 2 6 4.2M8 2l2 2.2"/><path d="M2 8h12M14 8l-2.2-2M14 8l-2.2 2"/></svg>
                </button>
                <button class="tb toggle" id="tg-labels" type="button" title="toggle tick labels" aria-label="tick labels" aria-pressed="true">
                  <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h6l4 4-6 6-4-4z"/><circle cx="6" cy="6" r="1" fill="currentColor" stroke="none"/></svg>
                </button>
              </div>
              <!-- The class list carries `tg-gear` (the class the CSS targets
                   to hide this button on wide viewports and style it when the
                   popover is open), alongside the shared `tb` button style. -->
              <button class="tb gear tg-gear" id="tg-gear" type="button" title="view options" aria-label="view options" aria-haspopup="true" aria-expanded="false">
                <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="2.2"/><path d="M8 2v2M8 12v2M2 8h2M12 8h2M3.8 3.8l1.4 1.4M10.8 10.8l1.4 1.4M12.2 3.8l-1.4 1.4M5.2 10.8l-1.4 1.4"/></svg>
              </button>
            </div>
          </div>
          <!-- Cursor coordinate readout: pinned bottom-left of the stage,
               showing the live viewBox x/y under the pointer. Filled by
               explore-view.js on pointermove; cleared on pointerleave. -->
          <div class="coord-readout" id="coord-readout" aria-hidden="true"></div>
          <!-- Zoom indicator: the current zoom factor relative to the
               motif's natural viewBox, updated on every applyViewBox. -->
          <div class="zoom-ind" id="zoom-ind" aria-hidden="true"></div>
          <div class="placeholder" id="placeholder">
            <svg class="glyph" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18M12 3v18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>
            </svg>
            <span class="main" id="ph-main">pick a motif</span>
            <span class="hint">or press <code>/</code> to search</span>
          </div>
          <div class="anim-progress" id="anim-progress" aria-hidden="true"><i></i></div>
          <!-- Export-in-progress overlay: a small centered pill that appears
               while a slow export (PNG / GIF) is running in Pyodide. The whole
               page is main-thread-blocked during those calls, so this tells the
               user work is happening instead of leaving a frozen page that looks
               hung. The spinner is a compositor-driven transform, which keeps
               turning even while the synchronous Python call occupies the main
               thread. -->
          <div class="exporting" id="exporting" role="status" aria-live="polite" aria-hidden="true">
            <span class="exporting-spin" aria-hidden="true"></span>
            <span class="exporting-text">exporting…</span>
          </div>
        </div>
      </div>
      <!-- Stage scrubber: the single master clock, pinned directly under the
           canvas so the transport (play / loop), the range scrub and the t=
           readout live as one self-contained row next to the picture. It reads
           the live frame via E.playState.idx / E.syncScrubber(); dragging it
           draws that frame. Hidden in Design mode; enterAnim / exitAnim drop the
           `hidden` attribute. The .scrubber class reuses the former animator
           scrubber's thumb styling. -->
      <div class="stage-scrubber" id="stage-scrubber" hidden>
        <button class="tp" id="tp-play" type="button" title="play / pause" aria-label="play or pause animation">
          <svg class="ico play" width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M5 2.5 13 8 5 13.5z"/></svg>
          <svg class="ico pause" width="12" height="12" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><rect x="4" y="2.5" width="3.4" height="11" rx="0.8"/><rect x="8.6" y="2.5" width="3.4" height="11" rx="0.8"/></svg>
        </button>
        <button class="tp toggle" id="tp-loop" type="button" title="loop playback" aria-label="loop playback" aria-pressed="true">loop</button>
        <input class="scrubber" id="stage-scrub-input" type="range" min="0" max="1" step="0.001" value="0" aria-label="scrub timeline">
        <span class="scrub-time" id="scrub-time" aria-hidden="true">t = 0.000</span>
      </div>
      <div class="meta" id="meta"></div>
    </section>

    <!-- Design panel: the right-hand aside the user sees in Design mode --
         the parameter sliders, the command line, and the still SVG / PNG / spec
         JSON exports. It is a tabpanel labeled by the Design mode tab; the
         Animate mode tab swaps it for the .animator aside below. The #controls
         list is wrapped in a slot so it can reparent into the animator (and
         back) without cloning -- appendChild preserves every slider handler. -->
    <aside class="controls" id="design-panel" role="tabpanel" aria-labelledby="mode-design">
      <div class="label">Parameters</div>
      <div class="controls-slot" id="controls-slot">
        <div class="controls-list" id="controls"></div>
      </div>
      <div class="command-block">
        <div class="command-label"><span class="label">Command</span></div>
        <pre class="command" id="command">geomotif render</pre>
        <div class="command-buttons">
          <button class="copy" id="copy" type="button">copy command</button>
          <button class="copy share" id="share" type="button">copy share URL</button>
        </div>
        <div class="export-row">
          <span class="label">Export</span>
          <div class="export-buttons">
            <button class="copy export" id="exp-svg" type="button">SVG</button>
            <button class="copy export" id="exp-png" type="button">PNG</button>
            <button class="copy export" id="exp-spec" type="button">spec JSON</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- Animator panel: the Animate-mode counterpart of .controls. Carries
         role="tabpanel" labeled by the Animate mode tab and is hidden at boot;
         explore-mode.js drops the `hidden` attribute and reparents #controls
         into the slot so the same sliders set keyframe values. The single
         master clock (the stage scrubber with play / loop) lives under the
         canvas, not here. The tracks / transport / overlays blocks live in
         #timeline, and the animation export row (GIF + spec JSON) sits at the
         bottom. The still SVG / PNG / spec exports stay in the Design panel. -->
    <aside class="animator" id="animator" role="tabpanel" aria-labelledby="mode-animate" hidden>
      <div class="label">Parameters</div>
      <div class="anim-controls-slot" id="anim-controls-slot"></div>
      <section class="timeline" id="timeline" aria-label="animation timeline">
        <!-- A labeled section heading separates the parameters above from the
             keyframe lanes below, so the animator reads as two distinct
             sections instead of one continuous list. -->
        <div class="anim-section-head"><span class="label">Keyframes</span></div>
        <!-- A prominent "Set keyframes for all params at t=..." button at the
             top of the tracks section. Clicking drops a keyframe for every
             animatable parameter at the scrubber's current time, holding each
             slider's current value. The t= span updates live with the scrubber
             so the button always tells the user what they will get. Hidden on
             touch (the timeline is read-only there). -->
        <div class="kf-set-all-row" id="kf-set-all-row">
          <button class="kf-set-all" id="kf-set-all" type="button" title="set a keyframe for every animatable parameter at the scrubber's time">Set keyframes for all params at t=<span id="kf-set-all-t">0.000</span></button>
          <button class="kf-lock" id="kf-lock" type="button" aria-pressed="true" title="keyframe drags lock to one axis (value vs time)">lock</button>
        </div>
        <div class="tracks" id="tracks"></div>
        <!-- The transport + overlays blocks stay in place but are now
             visually grouped under explicit "Playback" and "Motion overlays"
             section headings, so the animator reads as labeled sections
             instead of two dashed rows. No behavior change. -->
        <!-- The transport row now carries only the recipe fields (frames / fps
             / hold / easing); the play / pause and loop buttons moved onto the
             stage scrubber, the single clock under the canvas. -->
        <div class="anim-section-head"><span class="label">Playback</span></div>
        <div class="transport" id="transport">
          <label class="tp-field">frames <input id="tp-frames" type="number" min="32" max="240" step="1" value="48"></label>
          <label class="tp-field">fps <input id="tp-fps" type="number" min="1" max="60" step="1" value="20"></label>
          <label class="tp-field">hold <input id="tp-hold" type="number" min="0" step="1" value="12"></label>
          <label class="tp-field">easing
            <select id="tp-easing" class="tp-select">
              <option>linear</option><option>quadratic</option>
              <option selected>cubic</option><option>sinusoidal</option>
              <option>exponential</option><option>circular</option>
            </select>
          </label>
        </div>
        <div class="anim-section-head"><span class="label">Motion overlays</span></div>
        <div class="overlays" id="overlays">
          <label class="ov-toggle"><input type="checkbox" id="ov-draw"> draw-on (pen reveal)</label>
          <span class="ov-opts" id="ov-draw-opts">
            <label>trail <input id="ov-trail" type="number" min="0" step="1" placeholder="none"></label>
          </span>
          <label class="ov-toggle"><input type="checkbox" id="ov-spin"> spin (rotate)</label>
          <span class="ov-opts" id="ov-spin-opts">
            <label>turns <input id="ov-turns" type="number" min="0" step="0.1" value="1"></label>
          </span>
        </div>
      </section>
      <div class="anim-export-row">
        <span class="label">Export</span>
        <div class="export-buttons">
          <button class="copy export gif" id="exp-gif" type="button" disabled>GIF</button>
          <button class="copy export" id="exp-spec-anim" type="button">spec JSON</button>
        </div>
      </div>
    </aside>
  </main>

  <!-- Load-status toast: a small fixed pill at the bottom of the viewport that
       auto-dismisses after ~2.5s. Boot-and-render progress ("ready", "loading
       Pyodide…", …) surfaces here instead of as a stranded string in the header's
       #status slot; the slot keeps its box so the header layout does not shift. -->
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <!-- lz-string: the one justified client dependency, vendored (not CDN) so the
       page stays offline-capable and the "no npm / no build step" criterion
       holds. Used only to compress the animation recipe into the share URL's
       `a=` fragment; the still `m=` fragment is plain base64url. -->
  <script src="lz-string.js"></script>
  <!-- The SPA is split by concern into IIFE modules sharing one `EXPLORE`
       namespace; order matters only for the namespace's creation, which the
       bootstrap file owns. Classic scripts (no ES modules) preserve the
       project's "no build step" ethos and work the same from a server. -->
  <script src="explore-bootstrap.js"></script>
  <script src="explore-pybridge.js"></script>
  <script src="explore-grid.js"></script>
  <script src="explore-view.js"></script>
  <script src="explore-fragment.js"></script>
  <script src="explore-controls.js"></script>
  <script src="explore-catalog.js"></script>
  <script src="explore-animation.js"></script>
  <script src="explore-mode.js"></script>
  <script src="app.js"></script>
</body>
</html>
