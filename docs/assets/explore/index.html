<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>geomotif explore</title>
  <link rel="stylesheet" href="app.css">
  <script>
    // Paint the right theme on first paint, before app.js loads: a stored
    // manual choice wins, otherwise the OS preference decides. Without this
    // the page would flash the light theme before app.js runs on a dark OS.
    (function () {
      var stored = localStorage.getItem("geomotif.theme");
      var dark = stored ? stored === "dark"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
    })();
  </script>
</head>
<body>
  <header>
    <a class="wordmark" href="/" title="back to docs">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" aria-hidden="true">
        <circle cx="12" cy="12" r="9"/>
        <path d="M3 12h18M12 3v18"/>
        <circle cx="12" cy="12" r="3" fill="currentColor" stroke="none"/>
      </svg>
      <b>geomotif</b><span class="dim">/ explore</span>
    </a>
    <input class="search" type="search" placeholder="search motifs…" autocomplete="off" aria-label="search motifs">
    <a class="nav-link" href="/" title="back to docs">docs</a>
    <button class="nav-link" id="theme" type="button" title="toggle light / dark" aria-pressed="false">theme</button>
    <span class="status" id="status">loading catalog…</span>
    <span class="progress" id="progress" aria-hidden="true"><i></i></span>
  </header>

  <main class="layout">
    <aside class="rail">
      <div class="label">Motifs</div>
      <nav class="families" id="families" aria-label="motif families"></nav>
      <ul class="motifs" id="motifs"></ul>
    </aside>

    <section class="stage-area">
      <div class="stage-wrap">
        <div class="stage" id="stage">
          <!-- Coordinate grid overlay: an SVG layer behind the motif that
               renders a Desmos-style plane -- major/minor gridlines, axes
               through the origin with arrowheads, and tick labels. It mirrors
               E.viewBox on every zoom/pan tick (repainted by explore-grid.js)
               and is hidden by .no-grid / .no-axes / .no-labels on .stage. -->
          <svg class="grid-overlay" id="grid-overlay" viewBox="0 0 520 520" preserveAspectRatio="none" aria-hidden="true">
            <g class="grid-minor"></g>
            <g class="grid-major"></g>
            <g class="grid-axes"></g>
            <g class="grid-labels"></g>
          </svg>
          <div class="stage-toolbar" id="toolbar" role="toolbar" aria-label="view">
            <button class="tb" id="zoom-out" type="button" title="zoom out">−</button>
            <button class="tb" id="fit" type="button" title="fit to view">fit</button>
            <button class="tb" id="zoom-in" type="button" title="zoom in">+</button>
            <span class="tb-sep" aria-hidden="true"></span>
            <button class="tb toggle" id="tg-grid" type="button" title="toggle coordinate grid" aria-pressed="true">grid</button>
            <button class="tb toggle" id="tg-axes" type="button" title="toggle axes through the origin" aria-pressed="true">axes</button>
            <button class="tb toggle" id="tg-labels" type="button" title="toggle tick labels" aria-pressed="true">labels</button>
            <span class="tb-sep" aria-hidden="true"></span>
            <button class="tb toggle" id="play" type="button" title="enter / leave animation mode" aria-pressed="false">play</button>
          </div>
          <!-- Cursor coordinate readout: pinned bottom-left of the stage,
               showing the live viewBox x/y under the pointer. Filled by
               explore-view.js on pointermove; cleared on pointerleave. -->
          <div class="coord-readout" id="coord-readout" aria-hidden="true"></div>
          <!-- Zoom indicator: the current zoom factor relative to the
               motif's natural viewBox, updated on every applyViewBox. -->
          <div class="zoom-ind" id="zoom-ind" aria-hidden="true"></div>
          <div class="placeholder" id="placeholder">
            <svg class="glyph" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" aria-hidden="true">
              <circle cx="12" cy="12" r="9"/>
              <path d="M3 12h18M12 3v18M5.6 5.6l12.8 12.8M18.4 5.6 5.6 18.4"/>
            </svg>
            <span class="main" id="ph-main">pick a motif</span>
            <span class="hint">or press <code>/</code> to search</span>
          </div>
          <div class="anim-progress" id="anim-progress" aria-hidden="true"><i></i></div>
        </div>
      </div>
      <div class="meta" id="meta"></div>
      <section class="timeline" id="timeline" aria-label="animation timeline">
        <div class="timeline-head">
          <span class="label">Timeline</span>
          <span class="scrubber-row">
            <input class="scrubber" id="scrubber" type="range" min="0" max="1" step="0.001" value="0" aria-label="scrub">
          </span>
        </div>
        <div class="tracks" id="tracks"></div>
        <div class="transport" id="transport">
          <button class="tp" id="tp-play" type="button" title="play / pause">play</button>
          <button class="tp toggle" id="tp-loop" type="button" title="loop playback" aria-pressed="true">loop</button>
          <label class="tp-field">frames <input id="tp-frames" type="number" min="32" max="240" step="1" value="48"></label>
          <label class="tp-field">fps <input id="tp-fps" type="number" min="1" max="60" step="1" value="20"></label>
          <label class="tp-field">hold <input id="tp-hold" type="number" min="0" step="1" value="12"></label>
          <label class="tp-field">easing
            <select id="tp-easing" class="tp-select">
              <option>linear</option><option>quadratic</option>
              <option selected>cubic</option><option>sinusoidal</option>
              <option>exponential</option><option>circular</option>
            </select>
          </label>
        </div>
        <div class="overlays">
          <span class="label">Overlays</span>
          <label class="ov-toggle"><input type="checkbox" id="ov-draw"> draw-on (pen reveal)</label>
          <span class="ov-opts" id="ov-draw-opts">
            <label>trail <input id="ov-trail" type="number" min="0" step="1" placeholder="none"></label>
          </span>
          <label class="ov-toggle"><input type="checkbox" id="ov-spin"> spin (rotate)</label>
          <span class="ov-opts" id="ov-spin-opts">
            <label>turns <input id="ov-turns" type="number" min="0" step="0.1" value="1"></label>
          </span>
        </div>
      </section>
    </section>

    <aside class="controls">
      <div class="label">Parameters</div>
      <h2 id="control-title">—</h2>
      <div class="controls-list" id="controls"></div>
      <div class="command-block">
        <div class="command-label"><span class="label">Command</span></div>
        <pre class="command" id="command">geomotif render</pre>
        <div class="command-buttons">
          <button class="copy" id="copy" type="button">copy command</button>
          <button class="copy share" id="share" type="button">copy share URL</button>
        </div>
        <div class="export-row">
          <span class="label">Export</span>
          <div class="export-buttons">
            <button class="copy export" id="exp-svg" type="button">SVG</button>
            <button class="copy export" id="exp-png" type="button">PNG</button>
            <button class="copy export" id="exp-spec" type="button">spec JSON</button>
            <button class="copy export gif" id="exp-gif" type="button" disabled>GIF</button>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <!-- lz-string: the one justified client dependency, vendored (not CDN) so the
       page stays offline-capable and the "no npm / no build step" criterion
       holds. Used only to compress the animation recipe into the share URL's
       `a=` fragment; the still `m=` fragment is plain base64url. -->
  <script src="lz-string.js"></script>
  <!-- The SPA is split by concern into IIFE modules sharing one `EXPLORE`
       namespace; order matters only for the namespace's creation, which the
       bootstrap file owns. Classic scripts (no ES modules) preserve the
       project's "no build step" ethos and work the same from a server. -->
  <script src="explore-bootstrap.js"></script>
  <script src="explore-pybridge.js"></script>
  <script src="explore-grid.js"></script>
  <script src="explore-view.js"></script>
  <script src="explore-fragment.js"></script>
  <script src="explore-controls.js"></script>
  <script src="explore-catalog.js"></script>
  <script src="explore-animation.js"></script>
  <script src="app.js"></script>
</body>
</html>
