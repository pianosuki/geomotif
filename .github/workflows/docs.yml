name: Docs

# The site is rebuilt from the code on every push to main. Nothing about it is
# committed except the catalog and the README's images, so "deploy" and
# "regenerate" are the same action and the published pages cannot describe a
# version of the library that no longer exists.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one that is in flight: a
# half-published site is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      # With the extras, so the four scipy motifs are rendered rather than
      # documented as unavailable.
      - run: pip install -e '.[all]' --group docs
      - run: mkdocs build --strict
      # The explorer is a static SPA served from <site>/explore/ alongside the
      # docs. The SPA sources live under docs/assets/explore/ (mkdocs copies
      # them to site/assets/explore/ as well, but the explorer's own index.html
      # loads its assets relative to its own URL, so they must sit beside it).
      # The wheel is built from the same code the docs describe, and its name
      # carries catalog.geomotif's version, so app.js (which derives WHEEL_URL
      # from that field) and the build stay in lockstep automatically.
      - name: Build wheel
        run: pip wheel . --no-deps -w dist
      - name: Stage explorer
        run: |
          mkdir -p site/explore
          cp dist/geomotif-*-py3-none-any.whl site/explore/
          cp docs/assets/explore/index.html \
             docs/assets/explore/app.css \
             docs/assets/explore/app.js \
             docs/assets/explore/lz-string.js \
             docs/assets/explore/catalog.json \
             site/explore/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
